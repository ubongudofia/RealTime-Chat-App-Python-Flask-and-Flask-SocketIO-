<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Messenger</title>
    <link rel="stylesheet" href="dsa-messenger.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css')}}" />
</head>
<body>
    <div class="bg-container">
        <div class="background-overlay"></div>
        
        <div class="content">
            <!-- Right side - Messenger -->
            <div class="messenger-section">
                <div class="messenger-card">
                    <div class="messenger-header">
                        <div class="messenger-logo">
                            <img src="{{ url_for('static', filename='images/dsa-logo.png') }}" alt="DSA Logo">
                        </div>
                        <div class="messenger-info">
                            <h1>DSA Messenger</h1>
                            <p>Chat, share files, and stay connected</p>
                        </div>
                    </div>
                    
                    <div class="messenger-actions">
                        <button class="btn-home btn-primary-home" id="signupBtn"><a href="/register">Sign Up</a></button>
                        <button class="btn-home btn-secondary-home" id="signinBtn"><a href="/login">Sign In</a></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
